name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit tests
        run: |
          pip install cryptography
          python -m unittest discover tests

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase

      - name: Create Android project
        run: briefcase create android --no-input -v

      - name: Build APK
        run: briefcase build android --no-input -v

      - name: Collect APK
        run: |
          APK=$(find build -name "*.apk" | head -n 1)
          test -n "$APK" || { echo "No APK produced"; find build | head -50; exit 1; }
          mkdir -p dist
          cp "$APK" dist/sos69069-msg-debug.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: sos69069-msg-debug-apk
          path: dist/sos69069-msg-debug.apk
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: briefcase-logs
          path: logs/
          if-no-files-found: ignore

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sos69069-msg-debug.apk
