name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the APK to a tagged release

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python -m unittest discover tests -v

  apk:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Briefcase's Android target must use the same Python minor version
      # as the one running Briefcase, and Chaquopy has wheels for 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase

      - name: Generate launcher icons
        continue-on-error: true
        run: |
          python -m pip install pillow
          python tools/make_icons.py

      - name: Create Android project
        run: briefcase create android --no-input

      - name: Build debug APK
        run: briefcase build android --no-input

      - name: Locate APK
        id: apk
        run: |
          APK=$(find build -name "*.apk" -path "*outputs*" | head -n 1)
          if [ -z "$APK" ]; then echo "No APK found"; find build -name "*.apk"; exit 1; fi
          mkdir -p dist
          cp "$APK" dist/sos69069-msg-debug.apk
          ls -la dist
          echo "path=dist/sos69069-msg-debug.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: sos69069-msg-debug-apk
          path: dist/sos69069-msg-debug.apk
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sos69069-msg-debug.apk
